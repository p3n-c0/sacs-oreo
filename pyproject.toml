[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sacs-oreo"
version = "0.1.0"
description = "SACS Oreo: authorized web application security assessment CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SecureAfrica Cyber Solutions" }]
license = "MIT"
keywords = ["security", "web-security", "scanner", "owasp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0.2",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
sacs-oreo = "sacs_oreo.cli:main"
oreo = "sacs_oreo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
